<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- Globe icon -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="white" stroke-width="12"/>
  <ellipse cx="256" cy="256" rx="60" ry="140" fill="none" stroke="white" stroke-width="10"/>
  <line x1="256" y1="116" x2="256" y2="396" stroke="white" stroke-width="10"/>
  <line x1="116" y1="256" x2="396" y2="256" stroke="white" stroke-width="10"/>
  <ellipse cx="256" cy="256" rx="140" ry="50" fill="none" stroke="white" stroke-width="10"/>
  <ellipse cx="256" cy="256" rx="140" ry="90" fill="none" stroke="white" stroke-width="8" opacity="0.6"/>

  <!-- Timeline dots -->
  <circle cx="186" cy="186" r="12" fill="white"/>
  <circle cx="326" cy="186" r="12" fill="white"/>
  <circle cx="186" cy="326" r="12" fill="white"/>
  <circle cx="326" cy="326" r="12" fill="white"/>
</svg>
